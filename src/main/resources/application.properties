# Port chạy Server Web & REST API
server.port=8080

# -------------------------------------------------------------------
# CẤU HÌNH KẾT NỐI MYSQL DATABASE
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/pbl4_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Hien@1303
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# CẤU HÌNH SPRING DATA JPA / HIBERNATE
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# TẮT SQL LOG để tránh nghẽn I/O Console khi nhận dữ liệu dồn dập
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Giải phóng DB Connection ngay sau khi xong Transaction
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# TỐI ƯU HỆ THỐNG & CHỊU TẢI (BATCH INSERT & CONNECTION POOL)
# -------------------------------------------------------------------
# Gộp các câu lệnh INSERT thành lô (batch) giúp tăng tốc độ ghi DB khi có nhiều Agent
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool (Đã nâng tải cho kết nối từ máy khác/Docker)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=15000

spring.application.name=network-server