# Port chạy Server Web & REST API
server.port=8080

# -------------------------------------------------------------------
# CẤU HÌNH KẾT NỐI MYSQL DATABASE
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/pbl4_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Hien@1303
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# CẤU HÌNH SPRING DATA JPA / HIBERNATE
# -------------------------------------------------------------------
# Tự động tạo/cập nhật bảng trong CSDL dựa trên các class @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# TỐI ƯU HỆ THỐNG & CHỊU TẢI (BATCH INSERT & CONNECTION POOL)
# -------------------------------------------------------------------
# Gộp các câu lệnh INSERT thành lô (batch) giúp tăng tốc độ ghi DB khi có nhiều Agent
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.application.name=network-server
