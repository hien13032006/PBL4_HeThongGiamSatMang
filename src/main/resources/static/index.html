<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetworkTraffic</title>

    <!-- SockJS & STOMP cho WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light">

    <!-- Sidebar danh mục bên trái -->
    <aside class="sidebar">
        <div>
            <!-- Logo Brand -->
            <div class="brand-container">
                <span class="brand-logo">NetTraffic</span>
                <p class="brand-sub">Hệ thống giám sát lưu lượng mạng</p>
            </div>

            <!-- Navigation bên trái -->
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span>Tổng quan</span>
                </a>

                <a href="chitietAgent.html" class="nav-item">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                    <span>Chi tiết Agent</span>
                </a>

                <a href="#" class="nav-item">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Lịch sử</span>
                </a>

                <a href="#" class="nav-item nav-item-between">
                    <div class="nav-left">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span>Cảnh báo</span>
                    </div>
                    <span id="alert-count-badge" class="badge-red">0</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Workspace Nội dung chính bên phải -->
    <div class="main-workspace">
        
        <!-- Header trên cùng -->
        <header class="top-header">
            <h1 class="page-title">TỔNG QUAN HỆ THỐNG</h1>
            
            <!-- Khung bên phải Header: Trạng thái WebSocket & Nút Sáng/Tối -->
            <div class="header-right-actions">
                <!-- WebSocket Status Component -->
                <div id="ws-status-container" class="ws-container">
                    <!-- JavaScript sẽ render trạng thái ở đây -->
                </div>

                <!-- Nút chuyển Chế độ Sáng / Tối trên Header -->
                <button id="theme-toggle-btn" class="btn-theme-header">
                    Sáng/Tối
                </button>
            </div>
        </header>

        <!-- Main Content Container -->
        <main class="content-body">

            <!-- Metric Summary Cards -->
            <div class="metrics-grid">
                <div class="card">
                    <div class="card-label">Tổng số Agent</div>
                    <div id="metric-total" class="card-value">0</div>
                </div>

                <div class="card">
                    <div class="card-label">Đang Online</div>
                    <div id="metric-online" class="card-value text-emerald">0</div>
                </div>

                <div class="card">
                    <div class="card-label">Offline</div>
                    <div id="metric-offline" class="card-value">0</div>
                </div>

                <div class="card">
                    <div class="card-label">Băng thông RX tổng</div>
                    <div id="metric-rx-total" class="card-value">0.0 MB/s</div>
                </div>

                <div class="card">
                    <div class="card-label">Agent vượt ngưỡng</div>
                    <div id="metric-warning" class="card-value text-red">0</div>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Địa chỉ IP</label>
                    <input type="text" id="filter-ip" placeholder="vd: 192.168.1" class="form-input">
                </div>

                <div class="filter-group">
                    <label class="filter-label">Hệ điều hành</label>
                    <select id="filter-os" class="form-select">
                        <option value="">Tất cả</option>
                        <option value="Windows">Windows</option>
                        <option value="Ubuntu">Ubuntu</option>
                        <option value="Debian">Debian</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Trạng thái</label>
                    <select id="filter-status" class="form-select">
                        <option value="">Tất cả</option>
                        <option value="ONLINE">Online</option>
                        <option value="OFFLINE">Offline</option>
                    </select>
                </div>

                <div class="filter-group btn-align">
                    <button id="reset-filter-btn" class="btn-reset">
                        Xóa bộ lọc
                    </button>
                </div>
            </div>

            <!-- Agent Data Table -->
            <div class="table-card">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Trạng thái</th>
                                <th>Hostname</th>
                                <th>IP</th>
                                <th>Hệ điều hành</th>
                                <th class="text-right">RX (MB/s)</th>
                                <th class="text-right">TX (MB/s)</th>
                                <th class="text-right">Latency (ms)</th>
                                <th class="text-right">Packet Loss</th>
                                <th class="text-center">Chất lượng</th>
                            </tr>
                        </thead>
                        <tbody id="agent-table-body">
                            <!-- Dữ liệu bảng do app.js nạp vào -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Custom JavaScript File -->
    <script src="js/app.js"></script>
</body>
</html>
