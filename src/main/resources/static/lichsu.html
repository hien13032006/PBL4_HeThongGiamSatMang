<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch - Lịch sử Metrics</title>

    <!-- Thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SockJS & STOMP cho WebSocket Status trên Header -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <!-- Custom CSS thuần (dùng chung) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light">

    <!-- Sidebar bên trái -->
    <aside class="sidebar">
        <div>
            <div class="brand-container">
                <span class="brand-logo">NetWatch</span>
                <p class="brand-sub">Hệ thống giám sát lưu lượng mạng</p>
            </div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span>Tổng quan</span>
                </a>

                <a href="chitietAgent.html" class="nav-item">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                    <span>Chi tiết Agent</span>
                </a>

                <!-- Tab Lịch sử Active -->
                <a href="lichsu.html" class="nav-item active">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Lịch sử</span>
                </a>

                <a href="#" class="nav-item nav-item-between">
                    <div class="nav-left">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span>Cảnh báo</span>
                    </div>
                    <span id="alert-count-badge" class="badge-red">0</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-workspace">
        <!-- Header trên cùng -->
        <header class="top-header">
            <h1 class="page-title">Lịch sử Metrics</h1>
            
            <div class="header-right-actions">
                <!-- WebSocket Status Component -->
                <div id="ws-status-container" class="ws-container">
                    <!-- JavaScript sẽ render trạng thái ở đây -->
                </div>

                <!-- Nút chuyển Chế độ Sáng / Tối -->
                <button id="theme-toggle-btn" class="btn-theme-header">
                    Sáng/Tối
                </button>
            </div>
        </header>

        <main class="content-body">
            
            <!-- Thanh Bộ lọc Tra cứu (Tất cả nằm trên 1 hàng duy nhất) -->
            <div class="history-filter-bar">
                <div class="filter-item filter-item-agent">
                    <label class="filter-label">Agent</label>
                    <select id="history-agent-select" class="form-select font-bold">
                        <option value="">Đang tải danh sách...</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label class="filter-label">Từ</label>
                    <input type="datetime-local" id="history-start-time" class="form-input-time">
                </div>

                <div class="filter-item">
                    <label class="filter-label">Đến</label>
                    <input type="datetime-local" id="history-end-time" class="form-input-time">
                </div>

                <div class="filter-item btn-search-wrapper">
                    <button id="btn-search-history" class="btn-primary-teal">Tra cứu</button>
                </div>
            </div>

            <!-- Khung Biểu đồ Lịch sử RX/TX -->
            <div class="chart-card">
                <div class="chart-card-header">
                    <div class="chart-title">RX / TX trong khoảng thời gian (MB/s)</div>
                </div>

                <div class="chart-viewport-wrapper">
                    <canvas id="historyChart"></canvas>
                </div>

                <div id="custom-chart-legend" class="custom-legend-bottom">
                    <div class="legend-item">
                        <span class="legend-box rx-box"></span>
                        <span class="legend-text">RX (MB/s)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-box tx-box"></span>
                        <span class="legend-text">TX (MB/s)</span>
                    </div>
                </div>
            </div>

            <!-- Bảng Dữ liệu Chi tiết Bản ghi từ Database -->
            <div class="table-card">
                <div class="table-header-info" id="table-summary-info">
                    Đang nạp dữ liệu từ CSDL...
                </div>
                <div class="table-wrapper" style="max-height: 400px; overflow-y: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Agent ID</th>
                                <th class="text-right">RX (MB/s)</th>
                                <th class="text-right">TX (MB/s)</th>
                                <th class="text-right">RX pkt/s</th>
                                <th class="text-right">TX pkt/s</th>
                                <th class="text-right">Latency (ms)</th>
                                <th class="text-right">Packet Loss (%)</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            <!-- JS nạp dữ liệu CSDL vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Script xử lý trang Lịch sử -->
    <script src="js/lichsu.js"></script>
</body>
</html>
